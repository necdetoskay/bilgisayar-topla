name: OpenRouter Smoke Test

on:
  push:
    paths:
      - ".github/workflows/openrouter-secret-check.yml"
      - "packages/product-extractor/**"
      - "packages/shared-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      product_url:
        description: "Product URL to run through DeepSeek extraction"
        required: false
        default: "https://www.hepsiburada.com/lenovo-ideacentre-intel-core-ultra-5-226v-16gb-512gb-ssd-freedos-27-fhd-all-in-one-bilgisayar-f0jw000htr-pm-HBC0000FC0LTQ"

jobs:
  openrouter-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OPENROUTER_API_KEY presence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not configured."
            exit 1
          fi

          echo "OPENROUTER_API_KEY is configured."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenRouter DeepSeek V4 Flash smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT_EXTRACTOR_MODEL: deepseek/deepseek-v4-flash
        run: pnpm --filter @bilgisayar-topla/product-extractor run smoke:openrouter

      - name: Run DeepSeek product URL extraction
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT_EXTRACTOR_MODEL: deepseek/deepseek-v4-flash
          PRODUCT_URL: ${{ github.event.inputs.product_url || 'https://www.hepsiburada.com/lenovo-ideacentre-intel-core-ultra-5-226v-16gb-512gb-ssd-freedos-27-fhd-all-in-one-bilgisayar-f0jw000htr-pm-HBC0000FC0LTQ' }}
        run: |
          pnpm --filter @bilgisayar-topla/product-extractor run run:url "$PRODUCT_URL" --out=runs/product-extraction

      - name: Upload extraction outputs
        uses: actions/upload-artifact@v4
        with:
          name: product-extraction-deepseek
          path: runs/product-extraction/**
          if-no-files-found: error
