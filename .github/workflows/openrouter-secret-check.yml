name: OpenRouter Smoke Test

on:
  push:
    paths:
      - ".github/workflows/openrouter-secret-check.yml"
      - "packages/product-extractor/**"
      - "packages/shared-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      product_url:
        description: "Product URL to run through DeepSeek extraction"
        required: false
        default: "https://www.hepsiburada.com/lenovo-ideacentre-intel-core-ultra-5-226v-16gb-512gb-ssd-freedos-27-fhd-all-in-one-bilgisayar-f0jw000htr-pm-HBC0000FC0LTQ"
      benchmark_models:
        description: "Comma-separated models for optional model benchmark"
        required: false
        default: "deepseek/deepseek-v4-flash,~deepseek/deepseek-v4-flash-latest"

jobs:
  openrouter-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OPENROUTER_API_KEY presence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not configured."
            exit 1
          fi

          echo "OPENROUTER_API_KEY is configured."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OpenRouter DeepSeek V4 Flash smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT_EXTRACTOR_MODEL: deepseek/deepseek-v4-flash
        run: pnpm --filter @bilgisayar-topla/product-extractor run smoke:openrouter

      - name: Run DeepSeek product URL extraction
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT_EXTRACTOR_MODEL: deepseek/deepseek-v4-flash
          PRODUCT_EXTRACTOR_AI_TIMEOUT_MS: "30000"
          PRODUCT_URL: ${{ github.event.inputs.product_url || 'https://www.hepsiburada.com/lenovo-ideacentre-intel-core-ultra-5-226v-16gb-512gb-ssd-freedos-27-fhd-all-in-one-bilgisayar-f0jw000htr-pm-HBC0000FC0LTQ' }}
        run: |
          pnpm --filter @bilgisayar-topla/product-extractor run run:url "$PRODUCT_URL" --out=runs/product-extraction

      - name: Run optional product extraction model benchmark
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
        timeout-minutes: 8
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT_EXTRACTOR_AI_TIMEOUT_MS: "30000"
          PRODUCT_EXTRACTOR_BENCHMARK_MODELS: ${{ github.event.inputs.benchmark_models || 'deepseek/deepseek-v4-flash,~deepseek/deepseek-v4-flash-latest' }}
          PRODUCT_URL: ${{ github.event.inputs.product_url || 'https://www.hepsiburada.com/lenovo-ideacentre-intel-core-ultra-5-226v-16gb-512gb-ssd-freedos-27-fhd-all-in-one-bilgisayar-f0jw000htr-pm-HBC0000FC0LTQ' }}
        run: |
          pnpm --filter @bilgisayar-topla/product-extractor run bench:models "$PRODUCT_URL" --out=runs/product-extraction-model-benchmark

      - name: Print extraction quality summary
        if: always()
        run: |
          node <<'NODE'
          const { existsSync, readFileSync, readdirSync } = require("node:fs");
          const { join } = require("node:path");

          const root = "runs/product-extraction";
          if (!existsSync(root)) {
            console.log("No extraction output directory found.");
            process.exit(0);
          }

          const runDirs = readdirSync(root)
            .map((name) => join(root, name))
            .sort();
          const runDir = runDirs.at(-1);
          if (!runDir) {
            console.log("No extraction run directory found.");
            process.exit(0);
          }

          const readJson = (name) => JSON.parse(readFileSync(join(runDir, name), "utf8"));
          const profile = readJson("profile.json");
          const suitability = readJson("suitability-report.json");
          const compliance = readJson("compliance-report.json");
          const timing = existsSync(join(runDir, "timing-report.json"))
            ? readJson("timing-report.json")
            : {};

          console.log("EXTRACTION_SUMMARY_START");
          console.log(`runDir=${runDir}`);
          console.log(`profileReadiness=${profile.readiness}`);
          console.log(`specReadiness=${compliance.readiness}`);
          console.log(`productCategory=${profile.productCategory}`);
          console.log(`identityTitle=${profile.identity?.title ?? ""}`);
          console.log(`featureCount=${profile.features?.length ?? 0}`);
          console.log(`timingModel=${timing.model ?? ""}`);
          console.log(`timingAiTimeoutMs=${timing.aiTimeoutMs ?? ""}`);
          console.log(`timingFetchMs=${timing.fetchMs ?? ""}`);
          console.log(`timingHtmlReadMs=${timing.htmlReadMs ?? ""}`);
          console.log(`timingExtractionMs=${timing.extractionMs ?? ""}`);
          console.log(`timingSpecificationMs=${timing.specificationMs ?? ""}`);
          console.log(`timingTotalMs=${timing.totalMs ?? ""}`);
          console.log(`timingExtractionMode=${timing.extractionMode ?? ""}`);
          console.log(`suitabilityInclude=${suitability.summary?.include ?? 0}`);
          console.log(`suitabilityReview=${suitability.summary?.review ?? 0}`);
          console.log(`suitabilityExclude=${suitability.summary?.exclude ?? 0}`);
          for (const finding of compliance.findings ?? []) {
            console.log(
              `finding=${finding.severity}:${finding.code}:${finding.featureKey ?? ""}:${finding.message}`,
            );
          }

          const costPath = join(runDir, "cost-ledger.jsonl");
          if (existsSync(costPath)) {
            const costRecords = readFileSync(costPath, "utf8").trim().split("\n").filter(Boolean);
            for (const line of costRecords) {
              const record = JSON.parse(line);
              console.log(
                `cost=${record.model}:prompt=${record.usage?.promptTokens ?? ""}:completion=${record.usage?.completionTokens ?? ""}:total=${record.usage?.totalTokens ?? ""}:usd=${record.estimatedCostUsd ?? ""}`,
              );
            }
          } else {
            console.log("cost=missing");
          }
          console.log("EXTRACTION_SUMMARY_END");

          const benchmarkRoot = "runs/product-extraction-model-benchmark";
          if (existsSync(benchmarkRoot)) {
            const benchmarkRunDirs = readdirSync(benchmarkRoot)
              .map((name) => join(benchmarkRoot, name))
              .sort();
            const benchmarkRunDir = benchmarkRunDirs.at(-1);
            const benchmarkSummaryPath = benchmarkRunDir
              ? join(benchmarkRunDir, "model-benchmark-summary.json")
              : undefined;

            if (benchmarkSummaryPath && existsSync(benchmarkSummaryPath)) {
              const benchmark = JSON.parse(readFileSync(benchmarkSummaryPath, "utf8"));
              console.log("MODEL_BENCHMARK_SUMMARY_START");
              console.log(`benchmarkRunDir=${benchmarkRunDir}`);
              for (const row of benchmark.rows ?? []) {
                console.log(
                  [
                    `model=${row.model}`,
                    `ok=${row.ok}`,
                    `mode=${row.extractionMode ?? ""}`,
                    `category=${row.productCategory ?? ""}`,
                    `features=${row.featureCount ?? ""}`,
                    `include=${row.suitabilityInclude ?? ""}`,
                    `review=${row.suitabilityReview ?? ""}`,
                    `exclude=${row.suitabilityExclude ?? ""}`,
                    `fetchMs=${row.fetchMs ?? ""}`,
                    `extractionMs=${row.extractionMs ?? ""}`,
                    `totalMs=${row.totalMs ?? ""}`,
                    `tokens=${row.totalTokens ?? ""}`,
                    `usd=${row.estimatedCostUsd ?? ""}`,
                    `error=${row.error ?? ""}`,
                  ].join(" "),
                );
              }
              console.log("MODEL_BENCHMARK_SUMMARY_END");
            }
          }
          NODE

      - name: Upload extraction outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-extraction-deepseek
          path: |
            runs/product-extraction/**
            runs/product-extraction-model-benchmark/**
          if-no-files-found: warn
